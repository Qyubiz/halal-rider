# Panic Buyer research: download Binance data and run every refinement test on a GitHub runner, then commit
# the logs and result tables to research/panic_buyer/refine/results/. Runs only on the research branch.
name: panic-buyer-research
on:
  push:
    branches: [claude/charming-dijkstra-0orbab]
    paths:
      - "research/panic_buyer/refine/**"
      - "!research/panic_buyer/refine/results/**"
      - "!research/panic_buyer/refine/*.md"
      - ".github/workflows/panic-research.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: panic-research-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PB_DATA: /home/runner/pb_data
      PB_OUT: ${{ github.workspace }}/research/panic_buyer/refine/results
      THREADS: "16"
      SKIP_EXISTING: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pandas numba scipy matplotlib
      - uses: actions/cache@v4
        with:
          path: /home/runner/pb_data
          key: pb-data-v1
      - name: Download Binance candles
        working-directory: research/panic_buyer/refine
        run: |
          mkdir -p "$PB_OUT"
          bash fetch_all.sh 2>&1 | tee "$PB_OUT/fetch.log"
          du -sh "$PB_DATA"/* | tee -a "$PB_OUT/fetch.log"
      - name: Run all tests
        working-directory: research/panic_buyer/refine
        run: bash run_all.sh
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research/panic_buyer/refine/results
          git commit -m "Panic Buyer refinement: backtest results (run ${{ github.run_id }})" || exit 0
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
