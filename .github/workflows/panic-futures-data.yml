# Package public Binance USD-M futures data (data.binance.vision) as a pre-release for the m13 "futures" research:
# funding rates, open interest (metrics, 5-min -> hourly), 1h futures klines and 1h premium-index klines.
# The research uses it only as a SIGNAL for the spot bot (no futures trading). Delete the release when done.
name: panic-futures-data
on:
  push:
    branches: [claude/charming-dijkstra-0orbab]
    paths: [".github/workflows/panic-futures-data.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas
      - name: Download futures data
        run: |
          cat > /tmp/ff.py <<'EOF'
          import io, os, sys, time, zipfile, urllib.request, urllib.error
          from concurrent.futures import ThreadPoolExecutor
          import pandas as pd
          R = "https://data.binance.vision/data/futures/um"
          SY = ("BTC ETH SOL XRP BNB DOGE ADA TRX LINK AVAX SUI LTC BCH HBAR DOT NEAR ARB FET RENDER RNDR "
                "LUNA FTT SRM").split()
          SY = [s + "USDT" for s in SY]
          OUT = "/home/runner/fut"
          for d in ("funding", "klines", "premium", "oi"):
              os.makedirs(f"{OUT}/{d}", exist_ok=True)
          MONTHS = [m.strftime("%Y-%m") for m in pd.period_range("2019-09", "2026-10", freq="M")]
          DAYS = [d.strftime("%Y-%m-%d") for d in pd.date_range("2021-06-01", "2026-11-03", freq="D")]
          def get(url, tries=6):
              for k in range(tries):
                  try:
                      with urllib.request.urlopen(url, timeout=60) as r:
                          return r.read()
                  except urllib.error.HTTPError as e:
                      if e.code in (403, 404):
                          return None
                  except Exception:
                      pass
                  time.sleep(1.5 * (k + 1))
              print("GAVE UP", url, flush=True); return None
          def rd(b):
              with zipfile.ZipFile(io.BytesIO(b)) as z:
                  raw = z.read(z.namelist()[0])
              df = pd.read_csv(io.BytesIO(raw), header=None)
              if any(ch.isalpha() for ch in str(df.iloc[0, 0])):
                  df = df.iloc[1:]
              return df.reset_index(drop=True)
          def ms(x):
              t = pd.to_numeric(x).astype("int64")
              t = t.where(t < 10**14, t // 1000)
              return pd.to_datetime(t, unit="ms")
          def monthly(kind, sym, sub):
              parts = []
              for m in MONTHS:
                  b = get(f"{R}/monthly/{kind}/{sym}/{sub}{sym}-{kind if kind=='fundingRate' else sub.strip('/')}-{m}.zip")
                  if b: parts.append(rd(b))
              return pd.concat(parts) if parts else None
          def job(task):
              kind, sym = task
              try:
                  if kind == "funding":
                      df = monthly("fundingRate", sym, "")
                      if df is None: return f"{sym} funding: none"
                      x = pd.DataFrame({"t": ms(df.iloc[:, 0]), "rate": pd.to_numeric(df.iloc[:, -1])})
                  elif kind in ("klines", "premium"):
                      df = monthly("klines" if kind == "klines" else "premiumIndexKlines", sym, "1h/")
                      if df is None: return f"{sym} {kind}: none"
                      x = pd.DataFrame({"t": ms(df.iloc[:, 0])})
                      for j, c in enumerate("ohlc"):
                          x[c] = pd.to_numeric(df.iloc[:, 1 + j])
                      if kind == "klines":
                          x["qv"] = pd.to_numeric(df.iloc[:, 7])
                  else:
                      parts = []
                      for d in DAYS:
                          b = get(f"{R}/daily/metrics/{sym}/{sym}-metrics-{d}.zip", tries=4)
                          if b: parts.append(rd(b))
                      if not parts: return f"{sym} oi: none"
                      df = pd.concat(parts)
                      ct = pd.to_datetime(df.iloc[:, 0])
                      v = pd.DataFrame({"ct": ct, "oi": pd.to_numeric(df.iloc[:, 2], errors="coerce"),
                                        "oiv": pd.to_numeric(df.iloc[:, 3], errors="coerce"),
                                        "taker": pd.to_numeric(df.iloc[:, 7], errors="coerce")})
                      v = v.drop_duplicates("ct").sort_values("ct")
                      v["t"] = v.ct.dt.floor("h")      # bucket h holds create_time in [h, h+1h): known at h+1h
                      x = v.groupby("t").agg(oi=("oi", "last"), oiv=("oiv", "last"), taker=("taker", "mean"),
                                             n=("oi", "size"), last_ct=("ct", "max")).reset_index()
                  x = x.drop_duplicates("t").sort_values("t")
                  x.to_csv(f"{OUT}/{kind}/{sym}.csv.gz", index=False)
                  return f"{sym} {kind}: {len(x)} rows {x.t.iloc[0]} -> {x.t.iloc[-1]}"
              except Exception as e:
                  return f"{sym} {kind}: FAILED {e!r}"[:300]
          tasks = [(k, s) for k in ("oi", "funding", "klines", "premium") for s in SY]
          with ThreadPoolExecutor(48) as ex:
              for r in ex.map(job, tasks):
                  print(r, flush=True)
          EOF
          python3 /tmp/ff.py | tee /home/runner/fut_log.txt
          cp /home/runner/fut_log.txt /home/runner/fut/coverage.txt
      - name: Package and publish as a pre-release
        run: |
          mkdir -p /home/runner/pkg
          tar -C /home/runner -cf /home/runner/pkg/pb_futures.tar fut
          ls -la /home/runner/pkg
          gh release delete pb-futures-v1 --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create pb-futures-v1 --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
            --title "Panic Buyer research data (Binance USD-M futures signals)" \
            --notes "Public Binance USD-M futures data (data.binance.vision): funding rates, open interest (hourly from 5-min metrics), 1h klines, 1h premium index, 19 coins + RNDR/LUNA/FTT/SRM. Used only as a signal by research/panic_buyer/refine m13. Research data only; safe to delete." \
            /home/runner/pkg/pb_futures.tar
